services:
  - type: web
    name: latchos-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: latchos-db
          property: connectionURI
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        generateValue: true
      - key: MOCK_OCR
        value: "true"

databases:
  - name: latchos-db
    plan: free
